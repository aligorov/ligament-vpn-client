# CI: каждый push и PR.
# Rust-часть гоняется на macOS (быстрые риннеры, кроссплатформенный vpncore),
# Windows нужен для компиляции cfg(windows)-кода vpndaemon и Tauri-бриджа.
# Форматирование (cargo fmt) сознательно не блокирует CI.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-macos:
    name: rust (clippy + test, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

  rust-windows:
    name: rust (check, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Компиляция Windows-специфики (служба, pipe, движки) — без запуска
      # тестов: юнит-тесты vpncore уже отработали на macOS.
      - name: cargo check (daemon workspace)
        run: cargo check --workspace

      # Tauri-хост: движки для ресурсов не нужны — placeholder из репо;
      # ловим cfg(windows)-ошибки (напр. NamedPipeClient API) до релиза.
      - name: cargo check (tauri app)
        working-directory: app/src-tauri
        run: cargo check

      # E2E на настоящей Windows-машине: самоустановка службы и RPC.
      - name: Service e2e (install - RUNNING - pipe RPC - uninstall)
        shell: pwsh
        run: |
          cargo build --release -p corpvpnd
          $bin = "target\release\corpvpnd.exe"
          Write-Host "=== install-service ==="
          & $bin --install-service
          Write-Host "exit=$LASTEXITCODE"
          $ok = $false
          foreach ($i in 1..15) {
            $svc = Get-Service CorpVPND -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          sc.exe query CorpVPND
          sc.exe qc CorpVPND
          if (-not $ok) {
            Write-Host "=== CRASH LOG ==="
            Get-Content "$env:ProgramData\Ligament\CorpVPN\logs\corpvpnd-crash.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:ProgramData\Ligament\CorpVPN\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 20 }
            throw "corpvpnd: служба не RUNNING после --install-service"
          }
          Write-Host "=== named pipe RPC ==="
          $pipe = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'corpvpn-daemon', [System.IO.Pipes.PipeDirection]::InOut)
          $pipe.Connect(5000)
          $w = New-Object System.IO.StreamWriter($pipe); $w.AutoFlush = $true
          $r = New-Object System.IO.StreamReader($pipe)
          $w.WriteLine('{"jsonrpc":"2.0","id":1,"method":"corpvpn.state.get"}')
          $resp = $r.ReadLine()
          Write-Host $resp
          if ($resp -notmatch '"status"') { throw "pipe RPC не ответил" }
          Write-Host "PIPE RPC OK"
          & $bin --uninstall-service
          if (Get-Service CorpVPND -ErrorAction SilentlyContinue) { throw "служба не удалена" }
          Write-Host "E2E OK"

  ui:
    name: ui (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npx vite build
