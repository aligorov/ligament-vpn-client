# Релиз: установщики Windows (NSIS) и macOS (DMG) + GitHub Release.
# Запуск — тегом v* (например, v0.2.0). Публичный репозиторий: для сборки
# секреты не нужны; подписи (Azure Trusted Signing / Apple codesign) —
# опциональные шаги, см. installer/signing.md и README (macOS).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS DMG (VLESS/SOCKS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      # Только darwin-движки: xray (VLESS/REALITY, SOCKS-режим без admin).
      - name: Fetch pinned VPN engines (darwin)
        shell: pwsh
        run: pwsh -File installer/fetch-engines.ps1 -Platform darwin

      # Демон corpvpnd кладётся в бандл: приложение стартует его само
      # (unix-режим --console), launchd-служба — v0.3.
      - name: Build corpvpnd daemon
        run: cargo build --release -p corpvpnd

      - name: Stage daemon into engines dir
        run: |
          cp target/release/corpvpnd app/engines/corpvpnd
          ls -la app/engines

      # Tauri подписывает только главный бинарник/фреймворки, НЕ Resources:
      # неподписанный вложенный бинарник на arm64 убивается ядром ПОСЛЕ exec
      # (spawn возвращает Ok — ошибка невидима). Подписываем все исполняемые.
      - name: Ad-hoc sign nested binaries
        run: |
          chmod +x app/engines/corpvpnd app/engines/xray/xray
          codesign --force --sign - app/engines/corpvpnd
          codesign --force --sign - app/engines/xray/xray
          codesign -dv app/engines/corpvpnd 2>&1 | head -2

      - name: Build UI deps
        working-directory: app/ui
        run: npm install

      # Без подписи Apple: первый запуск — правый клик → Открыть (см. README).
      - name: Build Tauri app (DMG)
        working-directory: app
        run: npx @tauri-apps/cli build --bundles dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/src-tauri/target/release/bundle -type f -name '*.dmg' -exec cp {} dist/ \;
          cp installer/Enable-LigamentVPN.command dist/
          cp installer/DIAGNOSTICS.md dist/
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/Enable-LigamentVPN.command
            dist/DIAGNOSTICS.md

  windows-release:
    name: Windows installers (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      # Скачиваем движки по пиннингу installer/engine-lock.json (sha256).
      - name: Fetch pinned VPN engines
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File installer/fetch-engines.ps1

      # Служба corpvpnd собирается из того же репозитория и кладётся в
      # app/engines/ — Tauri упакует всё в resources → <install>\engines\.
      - name: Build corpvpnd service (Rust)
        run: cargo build --release -p corpvpnd

      - name: Stage service into engines dir
        shell: powershell
        run: |
          Copy-Item target/release/corpvpnd.exe app/engines/corpvpnd.exe -Force
          # wireguard-src — исходники для самостоятельной сборки tunnel.dll;
          # в пакет не идут (tunnel.dll извлекается из официального MSI).
          if (Test-Path app/engines/wireguard-src) {
            Remove-Item app/engines/wireguard-src -Recurse -Force
          }
          Get-ChildItem app/engines

      - name: Build UI deps
        working-directory: app/ui
        run: npm install

      - name: Build Tauri app (NSIS)
        working-directory: app
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find app/src-tauri/target/release/bundle -type f \
            \( -name '*_x64-setup.exe' -o -name '*_x64*.msi' \) \
            -exec cp {} dist/ \;
          cp installer/install-service.ps1 dist/
          cp installer/GUIDE-GPO.md dist/
          cp installer/DIAGNOSTICS.md dist/
          ls -la dist/

      # Опционально: подпись (см. installer/signing.md). Раскомментировать
      # после настройки секретов AZURE_TENANT_ID / AZURE_CLIENT_ID /
      # TS_ACCOUNT_NAME / TS_PROFILE_NAME.
      # - uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     trusted-signing-account-name: ${{ secrets.TS_ACCOUNT_NAME }}
      #     certificate-profile-name: ${{ secrets.TS_PROFILE_NAME }}
      #     endpoint-url: https://eus.codesigning.azure.net/
      #     files: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*_x64-setup.exe
            dist/*_x64*.msi
            dist/install-service.ps1
            dist/GUIDE-GPO.md
            dist/DIAGNOSTICS.md
