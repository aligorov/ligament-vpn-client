[package]
name = "vpncore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Кроссплатформенное ядро CorpVPN: модели, парсеры конфигов, портал-клиент"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
url = "2"
# rustls-tls без default-features: без openssl, кроссплатформенно (вкл. Windows).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
