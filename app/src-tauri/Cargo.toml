[package]
name = "corpvpn-app"
version = "0.1.0"
description = "Ligament VPN — корпоративный VPN-клиент (WireGuard + OpenVPN + VLESS)"
license = "MIT"
edition = "2021"

# Отдельный workspace: корневой workspace (crates/*) не включает Tauri-приложение.
[workspace]

[lib]
name = "corpvpn_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
strip = true
opt-level = "s"
